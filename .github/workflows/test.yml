# Corre a suite de testes em cada push para uma branch e em cada pedido de
# integração. As tags não disparam este workflow directamente: o build.yml
# chama-o (workflow_call) e só gera os executáveis se ele passar. Chega definir
# `branches` sem `tags`, porque o GitHub só dispara o trabalho para o tipo de
# ref definido.

name: Testes

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

# Só precisa de ler o repositório. O build.yml pede contents: write porque cria
# Releases.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Retirar o código
        uses: actions/checkout@v4

      # Mesma versão que o build.yml usa nos dois trabalhos.
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # O requirements-dev.txt inclui o requirements.txt, por isso este passo
      # instala as dependências de produção e as de desenvolvimento.
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # A partir de backend/, que é onde o ruff.toml e o
      # pyrightconfig.json estão. Sem a pasta venv, o pyright usa o
      # Python do runner, onde o requirements-dev.txt já foi instalado.
      - name: Correr o ruff e o pyright
        run: |
          ruff check
          ruff format --check
          pyright
        working-directory: backend

      # A partir de backend/, que é onde o pytest.ini está.
      - name: Correr os testes
        run: python -m pytest
        working-directory: backend

  # O frontend não tem testes; o lint é a única verificação. Com
  # --max-warnings 0 os avisos também falham, para não voltarem a acumular-se.
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Retirar o código
        uses: actions/checkout@v4

      # Mesma versão que o build.yml usa nos dois trabalhos.
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Correr o lint
        run: npm run lint -- --max-warnings 0
        working-directory: frontend
