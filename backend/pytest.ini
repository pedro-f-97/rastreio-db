[pytest]
testpaths = tests

# Os módulos do backend importam-se por nome absoluto ("from database import
# ..."), portanto a pasta backend/ tem de estar no sys.path. Sem isto, o pytest
# só injecta a pasta do ficheiro de teste (tests/) e `import database` falha.
pythonpath = .

# Os testes de integração partilham a BD in-memory e correm todos no mesmo
# processo; sequencial é o comportamento esperado e mais rápido aqui.
addopts = -q --strict-markers

# Um DeprecationWarning levantado pelo código do backend falha o teste, para
# não se acumularem. O último campo é a expressão regular do nome do módulo que
# emite o aviso; os módulos importam-se pelo nome sem "backend." (pythonpath = .).
filterwarnings =
    error::DeprecationWarning:(database|schemas|seguranca|tray|main|dados_iniciais|importador_transacoes|parser_importacao|routers|servicos)\b
